[colors]
background = "{{colors.surface.default.hex}}"
text_primary = "{{colors.on_surface.default.hex}}"
text_muted = "{{colors.outline.default.hex}}"
accent_primary = "{{colors.primary.default.hex}}"
accent_secondary = "{{colors.secondary.default.hex}}"
warning = "#f5c96b"
error = "{{colors.error.default.hex}}"
backdrop = "{{colors.background.default.hex}}"
insert_hint = "{{colors.primary.default.hex}}80"
shadow = "{{colors.shadow.default.hex}}70"

[colors.border]
