[colors.tab_bar]
background = "{{colors.surface.default.hex}}"
text = "{{colors.on_surface.default.hex}}"
active = "{{colors.primary.default.hex}}"
active_text = "{{colors.on_primary.default.hex}}"
active_unfocused = "{{colors.primary_container.default.hex}}"
active_unfocused_text = "{{colors.on_primary_container.default.hex}}"
